[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Warnings are errors in CI and in the local gates (`cargo clippy ... -- -D warnings`).
all = { level = "warn", priority = -1 }
# Hundredths are written so they read as decimals: 120_00 is 120.00.
inconsistent_digit_grouping = "allow"
