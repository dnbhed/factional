[package]
name = "factional-editor"
description = "Factional's visual content editor, in egui (DESIGN.md §18)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.36.2"
factional-content = { path = "../content" }
factional-egui = { path = "../egui" }
factional-core = { path = "../core" }
factional-quests = { path = "../quests" }
factional-reputation = { path = "../reputation" }
factional-session = { path = "../session" }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
toml = "1.1.6"

[lints]
workspace = true
