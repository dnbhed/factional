# Settings that neither content/sample nor docs/examples/riverhold uses, so the schema test
# (crates/content/tests/schema.rs) sees every key the schema names in a world that loads.

[knowledge]
model = "witnessed"

[inertia.profiles.stubborn]
law.toward_lawful = 0.5
law.toward_chaotic = [[-100.0, 1.0], [100.0, 0.5]]

[membership]
conflict = { resolve = "ask", auto_after_ticks = 50 }

[membership.defectors]
rules = [
  { when = { standing_with_target_below = 0.0 }, then = "refuse", reason = "We don't know you." },
  { when = { standing_with_current_below = -20.0 }, then = "accept" },
  { when = { standing_with_current_at_least = 50.0 }, then = "refuse", reason = "You're too loyal to them." },
  { then = "accept" },
]
