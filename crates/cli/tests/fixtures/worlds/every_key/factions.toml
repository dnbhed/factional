# One faction, so the world loads.

[city_watch]
name = "The City Watch"
alignment = { law = 70.0, good = 20.0 }
tolerance = 40.0
secret_members = true

[[city_watch.ranks]]
id = "recruit"

# A faction's own exposed table, replacing the world's (DESIGN.md §10.4).
[city_watch.exposed]
rules = [
  { when = { rank_at_least = "recruit" }, then = "demote" },
  { then = "keep" },
]
