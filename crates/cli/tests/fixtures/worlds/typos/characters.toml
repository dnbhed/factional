#:schema ../../../../../../schema/characters.schema.json
# The sample with three typos (U6c): Vex in lantern_gild, Captain Hale's weigths, and the
# Temple's drift policy demot, each fixed by the loader's "did you mean".

# Riverhold's characters (DESIGN.md §13).
#
# Each [table] is one character; its name is the id you type in the CLI.
# Alignment has two axes, each from -100 to 100:
#   law:  chaotic (-100) to lawful (+100)
#   good: evil (-100) to good (+100)
# The player is an ordinary character.
#
# weights (optional): how much a character cares about each axis when judging how far away
# someone is, 0 to 1. Without it, balance.toml's default_weights apply.
# inertia (optional): how hard their alignment is to move, a profile from balance.toml's
# [inertia.profiles]. Without it, the default profile applies.
# memberships (optional): the factions they start in, from factions.toml, each with an
# optional rank from that faction's ladder (the lowest if left out). Loading warns if someone
# starts further from a faction than its member_tolerance, or below their rank's standing.
# standing (optional): how others regard them at the start, -100 to 100, by faction or
# character id; anyone not named starts at 0.

[player]
name = "The Player"
alignment = { law = 0.0, good = 0.0 }

[captain_hale]
name = "Captain Hale"
alignment = { law = 75.0, good = 30.0 }
# Like the Watch he serves, Hale judges people by their respect for the law.
weigths = { law = 1.0, good = 0.25 }
# Hale's convictions have hardened over the years.
inertia = "hardening"
memberships = [{ faction = "city_watch", rank = "captain" }]
standing = { factions = { city_watch = 75.0 } }

[sister_mira]
name = "Sister Mira"
alignment = { law = 35.0, good = 85.0 }
inertia = "hardening"
memberships = [{ faction = "temple", rank = "ordained" }]
standing = { factions = { temple = 40.0 } }
# She ministers to Brother Ash, hoping to turn him.
contacts = ["brother_ash"]

[vex]
name = "Vex"
alignment = { law = -55.0, good = -20.0 }
memberships = [{ faction = "lantern_gild", rank = "fence" }]
standing = { factions = { lantern_guild = 30.0 } }

[merchant_ava]
name = "Merchant Ava"
alignment = { law = 20.0, good = 10.0 }
# Who she passes news to. A contact works both ways, so it's listed on one side only.
contacts = ["captain_hale", "sister_mira"]

[brother_ash]
name = "Brother Ash"
alignment = { law = 25.0, good = -70.0 }
memberships = [{ faction = "ashen_circle", rank = "initiate" }]
