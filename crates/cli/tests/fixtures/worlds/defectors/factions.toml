# Riverhold's Watch, Guild, Temple and Circle, with the Circle's own deserters table.
[city_watch]
name = "The City Watch"
alignment = { law = 70.0, good = 20.0 }
weights = { law = 1.0, good = 0.25 }
tolerance = 40.0
member_tolerance = 50.0

[[city_watch.ranks]]
id = "recruit"

[lantern_guild]
name = "The Lantern Guild"
alignment = { law = -60.0, good = -10.0 }
weights = { law = 1.0, good = 0.5 }
tolerance = 45.0
member_tolerance = 60.0

[[lantern_guild.ranks]]
id = "cutpurse"

[[lantern_guild.ranks]]
id = "fence"

[[lantern_guild.ranks]]
id = "shadow"

[temple]
name = "Temple of the Dawn"
alignment = { law = 30.0, good = 80.0 }
weights = { law = 0.5, good = 1.0 }
tolerance = 35.0

# The Temple takes only the Circle's juniors: a rank id in a faction's own table stands for
# that rank's rung on its ladder, here 2.
[temple.defectors]
rules = [
  { when = { rank_below = "ordained" }, then = "accept", standing_change = -5.0 },
  { then = "refuse", reason = "The Circle's elders stay in the dark." },
]

[[temple.ranks]]
id = "acolyte"

[[temple.ranks]]
id = "ordained"

[ashen_circle]
name = "The Ashen Circle"
alignment = { law = 20.0, good = -80.0 }
weights = { law = 0.25, good = 1.0 }
tolerance = 30.0
member_tolerance = 40.0

[ashen_circle.deserters]
rules = [
  { then = "refuse", reason = "No one leaves the Circle." },
]

[[ashen_circle.ranks]]
id = "initiate"
