[package]
name = "factional-cli"
description = "The `factional` command-line tool: an interactive REPL and a scenario-script runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "factional"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
factional-content = { path = "../content" }
factional-core = { path = "../core" }
factional-reputation = { path = "../reputation" }
rustyline = "18.0.1"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["glob"] }
