[package]
name = "factional-egui"
description = "What the editor and the inspector both draw, in egui: the console and the relations matrix (P-118, P-122)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
egui = { version = "0.36.2", default-features = false }
factional-reputation = { path = "../reputation" }
factional-session = { path = "../session" }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
factional-content = { path = "../content" }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }

[lints]
workspace = true
