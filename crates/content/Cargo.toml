[package]
name = "factional-content"
description = "Loads and validates Factional's designer content (TOML) from disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
factional-core = { path = "../core" }
factional-quests = { path = "../quests" }
factional-reputation = { path = "../reputation" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
factional-core = { path = "../core" }
jsonschema = { version = "0.58.6", default-features = false }
proptest = "1.11.0"
