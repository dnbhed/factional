name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install a software GPU for the editor's pictures (U19)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Keep the editor's pictures when one doesn't match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: editor-pictures
          path: crates/editor/tests/snapshots

  mutants:
    name: mutation testing (PR diff, shard ${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Mutants run one at a time within a job, so the diff's mutants are split across four
    # jobs that run side by side. Every shard must pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install a software GPU for the editor's pictures (U19)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff the PR against its base branch
        run: git diff "origin/${{ github.base_ref }}...HEAD" > branch.diff
      # A surviving mutant means a missing assertion (CLAUDE.md, Gates).
      - run: cargo mutants --no-shuffle --in-place --in-diff branch.diff --shard ${{ matrix.shard }}/4
      - name: Keep the report when mutants survive
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out-shard-${{ matrix.shard }}
          path: mutants.out

  # The Bevy plugin and the inspector build in a workspace of their own (P-117, P-121), so
  # the gates above never compile Bevy; its own gates run here, its mutants on its part of the
  # PR's diff.
  bevy:
    name: Bevy workspace (fmt, clippy, test, mutants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/bevy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bevy
      - name: Install a software GPU for the inspector's picture (G1)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The example's window and rendering are behind a feature, so the tests stay headless.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Keep the inspector's picture when it doesn't match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: inspector-picture
          path: crates/bevy/inspector/tests/snapshots
      - uses: taiki-e/install-action@v2
        if: github.event_name == 'pull_request'
        with:
          tool: cargo-mutants
      - name: Diff the plugin's part of the PR against its base branch
        if: github.event_name == 'pull_request'
        run: git diff --relative "origin/${{ github.base_ref }}...HEAD" -- . > branch.diff
      - if: github.event_name == 'pull_request'
        run: cargo mutants --workspace --no-shuffle --in-place --in-diff branch.diff
      - name: Keep the report when mutants survive
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out-bevy
          path: crates/bevy/mutants.out
