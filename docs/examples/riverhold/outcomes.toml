# outcomes.toml: named bundles of effects, applied to a character all at once. This is how a
# quest's result arrives, both before and after a quest module exists (DESIGN.md §7.1, §11).
# (M3)
#
# alignment: moves the character, with their inertia, like an action
# standing:  changes how factions (by id) or characters (by id) regard the character

[fined_by_watch]
standing = { factions = { city_watch = -20.0 }, characters = { captain_hale = -10.0 } }

[rescued_merchant]
alignment = { good = 6.0 }
standing = { factions = { city_watch = 10.0 }, characters = { merchant_ava = 30.0 } }

# A job well done for the Lantern Guild: enough to make a fence a shadow.
[fenced_the_crown_jewels]
standing = { factions = { lantern_guild = 30.0 } }

# The Watch's Oath (quests.toml): turning in a thief, or taking their money to look away. (Q1)
[turned_in_vex]
alignment = { law = 4.0 }
standing = { factions = { city_watch = 15.0, lantern_guild = -25.0 }, characters = { vex = -40.0 } }

[took_a_bribe]
alignment = { law = -4.0, good = -2.0 }
standing = { factions = { lantern_guild = 10.0 }, characters = { vex = 15.0 } }
